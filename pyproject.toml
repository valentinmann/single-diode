[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "single-diode"
dynamic = ["version"]
description = "Single diode photovoltaic modelling: datasheet to five parameters to I-V curve"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Valentin Mann" }]
keywords = ["photovoltaics", "solar", "single-diode", "lambert-w", "mppt", "modelling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

# Kept as an extra rather than only a PEP 735 dependency group so that
# `pip install -e ".[dev]"` works on any pip, which is one less thing between a
# reader and a green test run. The group below mirrors it for uv users.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.9",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "nox>=2024.3.2",
]

[dependency-groups]
dev = [{ include-group = "test" }, "ruff>=0.9", "mypy>=1.8", "pre-commit>=3.6", "nox>=2024.3.2"]
test = ["pytest>=8.0", "pytest-cov>=4.1"]

[project.urls]
Source = "https://github.com/valentinmann/single-diode"
Issues = "https://github.com/valentinmann/single-diode/issues"
Changelog = "https://github.com/valentinmann/single-diode/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "single_diode.__version__" }

[tool.setuptools.package-data]
single_diode = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "src"]
pythonpath = ["src", "."]
# --doctest-modules runs the examples in the docstrings. Without it they are
# documentation that nothing checks, which is how documentation starts lying.
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--doctest-modules",
]
xfail_strict = true
log_cli_level = "INFO"
log_level = "INFO"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/single_diode"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 92
# No target-version: ruff reads requires-python from [project] instead, so the
# floor is declared in exactly one place.

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "NPY",       # numpy-specific
    "RUF",       # ruff-specific
    "D",         # docstrings
    "ARG",       # unused arguments
    "BLE",       # blind except
    "C4",        # comprehensions
    "EM",        # exception messages assigned before raising
    "EXE",       # shebangs
    "FA",        # future annotations
    "FURB",      # modernisation
    "G",         # logging format
    "ICN",       # import conventions
    "ISC",       # implicit string concatenation
    "LOG",       # logging
    "PERF",      # performance anti-patterns
    "PGH",       # blanket noqa / type ignore
    "PIE",       # misc lints
    "PL",        # pylint
    "PT",        # pytest style
    "PTH",       # use pathlib
    "RET",       # return simplification
    "RSE",       # raise
    "SLOT",      # __slots__
    "T10",       # stray debugger
    "T20",       # stray print
    "TC",        # type-checking imports
    "TID",       # tidy imports
    "TRY",       # exception anti-patterns
    "YTT",       # sys.version checks
]
ignore = [
    "D100",      # module docstrings are a convention here, enforced by review
    "D104",      # the package docstring lives in __init__
    "D203", "D213",  # mutually exclusive with the google convention below
    "E741",      # `l` reads fine as a line index
    "ISC001",    # conflicts with the formatter
    "PLR0913",   # physics functions legitimately take many parameters
    "PLR2004",   # magic numbers are the point in a physics test
    "TRY003",    # long, specific error messages are worth more than short ones
    # EM wants every exception message hoisted into a variable before raising.
    # It buys a marginally cleaner traceback and costs a two-line detour at
    # every raise. The errors in this package are written to be read, so the
    # readable call site wins.
    "EM101", "EM102",
    # TC wants annotation-only imports deferred into a TYPE_CHECKING block.
    # This package imports numpy, scipy and matplotlib at runtime regardless,
    # so deferring `Path` or `Sequence` saves nothing measurable and splits
    # the import list in two.
    "TC001", "TC002", "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D101", "D102", "D103",  # the test name is the documentation
    "PLR2004",               # comparisons against literal physical values
    "SLF001",                # tests may reach into private helpers
    "PLR0917",               # fixture builders take many physical parameters
]
"examples/*" = ["T201"]      # a worked example is supposed to print

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
# No python_version pin: numpy's stubs use syntax that only parses on 3.12+,
# so mypy follows the interpreter it runs under. Compatibility with the floor
# declared in [project] is checked by the CI test matrix, not here.
packages = ["single_diode"]
mypy_path = "src"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
ignore_missing_imports = true
